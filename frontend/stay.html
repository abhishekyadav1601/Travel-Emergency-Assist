<!DOCTYPE html>
<html>

<head>
    <title>Stay / Hotel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🏨 Find a Place to Stay</h1>

    <p>Locate nearby hotels and safe accommodations.</p>

    <button onclick="getLocation()">📍 Find My Location</button>

    <div id="location"></div>

    <br>

    <h2>Nearby Hotels Map</h2>

    <iframe
        width="100%"
        height="450"
        style="border:0"
        loading="lazy"
        allowfullscreen
        src="https://www.google.com/maps?q=hotels+near+me&output=embed">
    </iframe>

    <br><br>

    <button onclick="saveEmergency('Hotel')">
        🚨 Need Stay
    </button>

    <button onclick="openNearby('hotel')">
        🏨 Nearby Hotels
    </button>

    <br><br>

    <a href="index.html">
        <button>⬅ Back</button>
    </a>

    <script src="script.js"></script>

</body>

</html>
