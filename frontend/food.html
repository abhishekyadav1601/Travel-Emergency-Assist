<!DOCTYPE html>
<html>

<head>
    <title>Food Nearby</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🍔 Food Nearby</h1>

    <p>Find restaurants and food places near you.</p>

    <button onclick="getLocation()">
        📍 Find My Location
    </button>

    <div id="location"></div>

    <br>

    <h2>Nearby Restaurants Map</h2>

    <iframe
        width="100%"
        height="450"
        style="border:0"
        loading="lazy"
        allowfullscreen
        src="https://www.google.com/maps?q=restaurants+near+me&output=embed">
    </iframe>

    <br><br>

    <button onclick="saveEmergency('Food')">
        🍴 Find Food
    </button>

    <button onclick="openNearby('restaurant')">
        🍽 Nearby Restaurants
    </button>

    <br><br>

    <a href="index.html">
        <button>⬅ Back</button>
    </a>

    <script src="script.js"></script>

</body>

</html>
